<script>
(function(){
try{
  var params=new URLSearchParams(location.search||'');
  var fromMentor=params.get('from')==='mentor'||/(mentor\.vkstech|mentor-app|\/mentor)/i.test(document.referrer||'');
  // Theme: Mentor first when opened from Mentor
  var mentorTheme=null;
  try{ mentorTheme=localStorage.getItem('vks_guidance_theme')||localStorage.getItem('mg_theme')||localStorage.getItem('mentor_theme'); }catch(e){}
  // Mentor UI uses class "dark" on html when dark
  var t=localStorage.getItem('mt_theme');
  if(fromMentor){
    if(mentorTheme==='light'||mentorTheme==='dark') t=mentorTheme;
    else {
      try{
        if(document.documentElement.classList.contains('dark')) t='dark';
        // If parent had light (no dark class), prefer light when from mentor and no mt_theme
        if(!t && mentorTheme!=='dark') t='light';
      }catch(e){}
    }
    if(!t) t='light'; // Mentor default looks light in screenshots
    try{ localStorage.setItem('mt_theme', t); }catch(e){}
  }
  t=t||'dark';
  document.documentElement.setAttribute('data-theme',t);
  if(t==='light')document.documentElement.classList.add('mt-preload-light');
  if(fromMentor) document.documentElement.classList.add('mt-from-mentor');
  // Language from Mentor / Man Power shared keys
  if(fromMentor){
    try{
      var L=localStorage.getItem('mentor_lang')||localStorage.getItem('mp_lang');
      if(L){ localStorage.setItem('mp_lang', L); localStorage.setItem('mt_lang', L); }
    }catch(e){}
  }
}catch(e){}
})();
</script>

<script>
// Boot after all Met_Train_Pro modules are loaded
(function bootMetTrain(){
  try {
    // Prefer Mentor language over a sticky mt_lang (fixes Hindi leftover in EN mentor)
    try {
      var mentorL = localStorage.getItem('mentor_lang') || localStorage.getItem('mp_lang');
      if (mentorL) {
        mentorL = String(mentorL).toLowerCase();
        if (mentorL === 'hindi' || mentorL === 'hin') mentorL = 'hi';
        if (mentorL === 'en' || mentorL === 'english') mentorL = 'en';
        localStorage.setItem('mt_lang', mentorL);
        if (typeof LANG !== 'undefined') LANG = mentorL;
      }
    } catch (e0) {}
    if (typeof mtInheritFromMentor === 'function') mtInheritFromMentor();
    try {
      var L = localStorage.getItem('mentor_lang') || localStorage.getItem('mt_lang') || localStorage.getItem('mp_lang') || 'en';
      L = String(L).toLowerCase();
      if (L === 'hindi' || L === 'hin') L = 'hi';
      if (L === 'english') L = 'en';
      if (typeof setLang === 'function') setLang(L, true);
      else if (typeof LANG !== 'undefined') LANG = L || 'en';
    } catch (e) {}
    if (typeof renderSOS === 'function') renderSOS();
    if (typeof renderSB === 'function') renderSB();
    if (typeof renderMobNav === 'function') renderMobNav();
    if (typeof nav === 'function') nav('landing');
    if (typeof updateTopbar === 'function') updateTopbar();
    if (typeof buildSearchIndex === 'function') buildSearchIndex();
  } catch (e) {
    console.error('Met Train PRO boot error:', e);
  }
})();
</script>
